<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estate Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f46e5' d='M12 3 2 11h3v9h5v-6h4v6h5v-9h3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/geoman/leaflet-geoman.css">
<link rel="stylesheet" href="/app.css">
<script>
  // Apply the saved theme before first paint.
  try { var t = localStorage.getItem('et-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-logo">⌂</span><span>Estate Tracker</span></a>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="searches">Wyszukiwania</a>
    <a href="#/offers" data-tab="offers">Oferty</a>
    <a href="#/map" data-tab="map">Mapa</a>
    <a href="#/alerts" data-tab="alerts">Alerty</a>
    <a href="#/settings" data-tab="settings">Ustawienia</a>
  </nav>
  <div class="topbar-right">
    <span class="run-status" id="runStatus"></span>
    <button class="btn btn-primary btn-sm" id="runNow" title="Sprawdź wszystkie aktywne wyszukiwania teraz">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 4v6h-6l2.3-2.3A6 6 0 1 0 18 12h2a8 8 0 0 1-16 0z"/></svg>
      <span>Sprawdź teraz</span>
    </button>
    <button class="icon-btn" id="themeToggle" title="Zmień motyw"><svg viewBox="0 0 24 24" class="ic"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </div>
</header>
<main id="app" class="container"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/geoman/leaflet-geoman.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
